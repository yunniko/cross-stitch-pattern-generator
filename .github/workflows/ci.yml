name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same flag as the Dockerfile: works around an npm/arborist peer-dependency crash.
      - run: npm ci --legacy-peer-deps

      - run: npm run lint
      # Route/layout types (e.g. LayoutProps) and next-env.d.ts are generated and git-ignored; a fresh checkout lacks them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # The processor's worker bundle is git-ignored, and the unit suite runs the pool and preview specs against it
      # (G-034 M2, M3), so it must be built before the tests rather than assumed present.
      - run: npm run build:processor
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium
      # CI=true makes playwright.config.ts build and start fresh servers (D102). Since G-034 M5 that is both the
      # processor and the app, because generation, the preview and the exports all run on the processor.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
