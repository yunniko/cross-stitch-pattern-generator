name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same flag as the Dockerfile: works around an npm/arborist peer-dependency crash.
      - run: npm ci --legacy-peer-deps

      - run: npm run lint
      # STANDARDS.md -> Code style: the formatter is a check, not a habit.
      - run: npm run format:check
      # Route/layout types (e.g. LayoutProps) and next-env.d.ts are generated and git-ignored; a fresh checkout lacks them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # The processor's worker bundle is git-ignored, and the unit suite runs the pool and preview specs against it
      # (G-034 M2, M3), so it must be built before the tests rather than assumed present.
      - run: npm run build:processor
      - run: npm run test:unit

      # No e2e here since G-068 M2: generation and exports need the Rust sidecar, so the whole suite runs in the
      # `rust` job below, which has the binary. Running it twice against two engines was the point before; there is
      # only one engine now.

  # The engine production actually runs. The job above exercises the TypeScript pipeline; every generation and
  # every server export on the live site goes through the Rust sidecar instead (D190, D193), so until this job
  # existed the suite was green about code no user ever reached (G-067 M1, STANDARDS.md -> "Verified means the
  # path production runs"). Separate from `check` so both run at once rather than the Rust build delaying the rest.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # `lto = "fat"` with one codegen unit makes a cold release build slow; the cache makes the usual run cheap.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: npm ci --legacy-peer-deps

      - run: cargo build --release --manifest-path rust/Cargo.toml

      # After the build, which is what creates rust/target. Without this file rust/cs-core/tests/jsmath_vectors.rs
      # says so and passes, leaving the bit-exactness it guards unchecked (D183). 50k samples a domain is ~680k
      # records against the 13.6M a local run writes: enough that a drifted implementation shows up immediately,
      # small enough not to spend a minute on it.
      - run: node scripts/rust-jsmath-vectors.mjs rust/target/jsmath-vectors.bin 50000
      - run: cargo test --release --manifest-path rust/Cargo.toml

      # The regression floor, asserted against Rust with no TypeScript in the loop: the binary production runs must
      # still produce the bytes D107 recorded. This is what survives the TypeScript pipeline being deleted (G-068).
      - run: npm run test:goldens:rust

      # Releasing an enhancement mode is the Owner's decision (D118) and these are the gates it rests on. They
      # drove the TypeScript pipeline until G-068 M3 deleted it; they drive the binary now.
      - run: npm run test:enhancement:rust

      # `lib/pipeline/enhance.ts` still ships as the photo pane's preview (D221). The preview and the chart come
      # from different languages, so this is what says they still agree pixel for pixel.
      - run: npm run test:enhance-parity:rust

      - run: npx next typegen
      - run: npm run build:processor

      # The processor's own job path. It needs the sidecar binary and the worker bundle built just above, and
      # belongs to this job rather than `check`, which has neither.
      - run: npm run test:processor:rust

      - run: npx playwright install --with-deps chromium

      # The e2e suite, against the only engine there is. A missing or failing binary now fails the job on its own,
      # without a flag to ask for it (G-068 M2).
      - run: npm run test:e2e
        env:
          CS_JOB_BINARY: ${{ github.workspace }}/rust/target/release/cs-job

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-rust
          path: |
            playwright-report
            test-results
          retention-days: 7
