name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same flag as the Dockerfile: works around an npm/arborist peer-dependency crash.
      - run: npm ci --legacy-peer-deps

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium
      # CI=true makes playwright.config.ts build and start a fresh production server (D102).
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
