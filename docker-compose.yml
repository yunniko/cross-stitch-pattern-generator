# Three services from this repo's Dockerfile (app, processor), plus Postgres for accounts (G-075) -- this
# project's first database. The caps on app/processor are D149's, measured on the production host -- this box
# runs ~20 other sites, so no service may take more than its share.
services:
  # `db` and `migrate` have no profile. `db` publishes no port here: the app and `migrate` reach it on the compose
  # network, and a host port would let any account on the shared host at it (G-117, D337). Local dev and the e2e suite
  # add the port with `docker-compose.dev.yml`:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cross_stitch
      # Production sets DB_PASSWORD in .env; the default is for a local or CI database only (D337). Postgres reads
      # this only when it first creates its data, so changing it later also needs `ALTER USER` (HANDOVER, Rules).
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cross_stitch}
      POSTGRES_DB: cross_stitch
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cross_stitch -d cross_stitch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration runner (the `build` stage has the full source tree and devDependencies, incl. the
  # Prisma CLI, which the slim `runtime` image below does not carry).
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cross_stitch:${DB_PASSWORD:-cross_stitch}@db:5432/cross_stitch

  # Production-style app container -- opt in with:
  #   docker compose --profile app up -d --build
  # (dev flow is `npm run dev` against the dev database above, no app/processor build needed)
  app:
    profiles: ["app"]
    build:
      context: .
      target: runtime
      args:
        # `APP_COMMIT=$(git rev-parse --short HEAD) docker compose ...` puts the commit in crash reports (G-066 M2).
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    environment:
      # No default on purpose: unset means only the request's own origin is trusted, which is what the
      # deployed site matches anyway. A localhost default would let a page on a visitor's own machine post
      # here if the deploy .env ever went missing, so the safe value is nothing at all.
      APP_URL: ${APP_URL:-}
      PROCESSOR_URL: http://processor:8081
      DATABASE_URL: postgresql://cross_stitch:${DB_PASSWORD:-cross_stitch}@db:5432/cross_stitch
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      # The site's own address for Auth.js's links and redirects; without it Auth.js names the container's bind
      # address (G-117). APP_URL is the same address, so it serves when AUTH_URL is not set.
      AUTH_URL: ${AUTH_URL:-${APP_URL:-}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Closed unless set to "true", and closed by itself once any admin exists (G-134 M1).
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      # How long a browser keeps its feature states before asking again (G-102); 300 when unset.
      FEATURES_REFRESH_SECONDS: ${FEATURES_REFRESH_SECONDS:-300}
      # Email (G-113, D342): off while MAIL_TRANSPORT is empty, so switching it on is only a change to .env.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Billing (G-106): off while BILLING_GATEWAY is empty. The keys are the Owner's; a live key is refused unless
      # STRIPE_LIVE=on (G-128).
      BILLING_GATEWAY: ${BILLING_GATEWAY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVE: ${STRIPE_LIVE:-}
      BILLING_RECONCILE_TOKEN: ${BILLING_RECONCILE_TOKEN:-}
    depends_on:
      processor:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:30150:3000"

  processor:
    profiles: ["app"]
    build:
      context: .
      target: processor
    restart: unless-stopped
    # Three pool workers, one core each (D149).
    cpus: 3.0
    mem_limit: 2g
    environment:
      PROCESSOR_PORT: 8081
    # Deliberately no `ports`: reachable only on the internal network, so the app's Route Handlers --
    # which hold the Origin check and the rate limit -- are its only caller.

  # The billing reconciliation's clock (G-106 M2): asks the app every BILLING_RECONCILE_MINUTES to re-read open
  # subscriptions from the provider. The work is the app's own route; this only calls it, on the internal network.
  # Without BILLING_RECONCILE_TOKEN it only waits.
  billing-reconcile:
    profiles: ["app"]
    image: node:22-alpine
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 64m
    command: ["node", "/loop/billing-reconcile-loop.mjs"]
    volumes:
      - ./scripts/billing-reconcile-loop.mjs:/loop/billing-reconcile-loop.mjs:ro
    environment:
      BILLING_RECONCILE_TOKEN: ${BILLING_RECONCILE_TOKEN:-}
      BILLING_RECONCILE_MINUTES: ${BILLING_RECONCILE_MINUTES:-60}
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
