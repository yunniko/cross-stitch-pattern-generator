<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G-095 layout mock-ups</title>
    <!--
  G-095 M1: three layout proposals for the Owner to choose from. Static mock-ups: nothing here is wired to the app.
  The picture, the thread names and every number are placeholders drawn by this file. The look (zinc, pills) is the
  present one on purpose: these compare layouts, not styles. Open with #A-photo, #B-text and so on, or use the bar.
  Screenshots: node scripts/design-mockup-shots.mjs
-->
    <style>
      :root {
        --bg: #f4f4f5;
        --surface: #fff;
        --line: #e4e4e7;
        --line2: #d4d4d8;
        --ink: #18181b;
        --ink2: #52525b;
        --ink3: #a1a1aa;
        --accent: #0f766e;
        --accent-bg: #ccfbf1;
        --temp: #b45309;
        --temp-bg: #fef3c7;
        --stage: #e9e9ec;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #d4d4d8;
        color: var(--ink);
        font:
          13px/1.35 system-ui,
          "Segoe UI",
          sans-serif;
      }
      .chooser {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        align-items: center;
        padding: 10px 16px;
        background: #18181b;
        color: #fafafa;
      }
      .chooser b {
        font-size: 14px;
      }
      .chooser .grp {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .chooser button {
        font: inherit;
        color: #e4e4e7;
        background: #3f3f46;
        border: 0;
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .chooser button.on {
        background: #fafafa;
        color: #18181b;
        font-weight: 600;
      }
      .wrap {
        overflow-x: auto;
        padding: 16px;
      }
      .frame {
        width: 1440px;
        margin: 0 auto;
      }
      .title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 0 0 8px;
      }
      .title h1 {
        font-size: 19px;
        margin: 0;
      }
      .title span {
        color: var(--ink2);
      }
      .app {
        height: 810px;
        background: var(--bg);
        border: 1px solid #a1a1aa;
        border-radius: 8px;
        overflow: hidden;
        display: grid;
        position: relative;
      }
      .notes {
        margin-top: 10px;
        background: #fff;
        border-radius: 8px;
        padding: 10px 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 28px;
      }
      .notes h3 {
        grid-column: 1/-1;
        margin: 0 0 2px;
        font-size: 13px;
      }
      .notes p {
        margin: 0;
        color: #3f3f46;
      }
      .notes p b {
        color: var(--ink);
      }

      /* pieces */
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        min-width: 0;
      }
      .brand {
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sp {
        flex: 1;
      }
      .sep {
        width: 1px;
        align-self: stretch;
        margin: 8px 2px;
        background: var(--line);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--line2);
        border-radius: 999px;
        background: var(--surface);
        white-space: nowrap;
        color: var(--ink);
      }
      .btn.sm {
        height: 24px;
        padding: 0 9px;
        font-size: 12px;
      }
      .btn.pri {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--ink2);
      }
      .btn.later {
        border-style: dashed;
        color: var(--ink3);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line2);
        border-radius: 999px;
        overflow: hidden;
        background: var(--surface);
      }
      .seg span {
        padding: 0 11px;
        height: 26px;
        display: flex;
        align-items: center;
        border-right: 1px solid var(--line);
        white-space: nowrap;
        color: var(--ink2);
      }
      .seg span:last-child {
        border-right: 0;
      }
      .seg span.on {
        background: var(--ink);
        color: #fff;
      }
      .lab {
        color: var(--ink2);
        font-size: 12px;
        white-space: nowrap;
      }
      .sw {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        display: inline-block;
        flex: none;
      }
      .sw.s {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .num {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 9px;
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: #fff;
        min-width: 44px;
      }
      .sel {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: #fff;
      }
      .sel::after {
        content: "▾";
        color: var(--ink3);
      }
      .wstabs {
        display: flex;
        gap: 2px;
        align-self: stretch;
        align-items: flex-end;
      }
      .wstabs span {
        padding: 9px 20px 8px;
        border-radius: 8px 8px 0 0;
        color: var(--ink2);
        font-weight: 600;
        border: 1px solid transparent;
        border-bottom: 0;
      }
      .wstabs span.on {
        background: var(--bg);
        color: var(--ink);
        border-color: var(--line);
      }
      .wstabs small {
        font-weight: 400;
        color: var(--ink3);
        margin-left: 6px;
      }
      .panel {
        background: var(--surface);
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--line);
      }
      .panel.right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        padding: 6px 8px 0;
        gap: 2px;
      }
      .tabs span {
        padding: 6px 11px 7px;
        border-radius: 7px 7px 0 0;
        color: var(--ink2);
        border: 1px solid transparent;
        border-bottom: 0;
        white-space: nowrap;

      .tabs span.on {

        border-color: var(--line);

      .tabs span.temp {
        color: var(--temp);
        background: var(--temp-bg);
        border-color: #fcd34d;
        font-weight: 600;
      }
      .pbody {
        padding: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 11px;
        flex: 1;
        min-height: 0;
      }
      .pbody h4 {
        margin: 4px 0 -3px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink3);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
      }
      .row > .lab {
        flex: none;
        width: 92px;
      }
      .sl {
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--line2);
        position: relative;
      }
      .sl i {
        position: absolute;
        top: -5px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--ink);
        margin-left: -7px;
      }
      .val {
        width: 34px;
        text-align: right;
        color: var(--ink2);
        font-variant-numeric: tabular-nums;
      }
      .hint {
        color: var(--ink2);
        font-size: 12px;
      }
      .note {
        background: var(--temp-bg);
        border: 1px solid #fcd34d;
        border-radius: 8px;
        padding: 7px 9px;
        color: #78350f;
        font-size: 12px;
      }
      .input {
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: #fff;
        padding: 6px 9px;
        min-height: 30px;
      }
      .rail {
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 8px 5px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        align-content: start;
      }
      .rail.one {
        grid-template-columns: 1fr;
      }
      .tool {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        height: 42px;
        border-radius: 8px;
        color: var(--ink2);
        font-size: 10px;
        border: 1px solid transparent;

      .tool b {
        font-size: 16px;
        line-height: 1;
        font-weight: 400;
        color: var(--ink);
      }
      .tool.on {
        background: var(--ink);
        color: #fff;
      }
      .tool.on b {
        color: #fff;
      }
      .tool.later {
        border: 1px dashed var(--line2);
        color: var(--ink3);
      }
      .tool.later b {
        color: var(--ink3);
      }
      .rail hr {
        grid-column: 1/-1;
        width: 100%;
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2px 0;
      }
      .htools {
        display: flex;
        gap: 3px;
        align-items: center;
      }
      .htools .tool {
        width: 46px;
        height: 40px;
      }
      .wsrail {
        background: #27272a;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 6px;
        align-items: stretch;
      }
      .wsrail span {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 9px 0;
        border-radius: 8px;
        color: #a1a1aa;
        font-size: 11px;
      }
      .wsrail span b {
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
      }
      .wsrail span.on {
        background: #fafafa;
        color: #18181b;
        font-weight: 600;
      }
      .stage {
        background: var(--stage);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-width: 0;
        min-height: 0;
        position: relative;
        padding: 14px;
      }
      canvas {
        display: block;
        background: #fff;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
      }
      .cap {
        font-size: 12px;
        color: var(--ink2);
        margin-bottom: 5px;
        display: flex;
        justify-content: space-between;
      }
      .float {
        z-index: 2;
        position: absolute;
        display: flex;
        gap: 8px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line2);
        border-radius: 12px;
        padding: 6px 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }
      .tries {
        display: flex;
        gap: 10px;
        align-items: stretch;
        padding: 10px 12px;
        background: var(--surface);
        border-top: 1px solid var(--line);
      }
      .try {
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
        background: #fff;
      }
      .try.on {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-bg);
      }
      .try canvas {
        box-shadow: none;
        border: 1px solid var(--line);
      }
      .try div {
        font-size: 12px;
        color: var(--ink2);
      }
      .try div b {
        display: block;
        color: var(--ink);
        font-size: 13px;
      }
      .thread {
        display: grid;
        grid-template-columns: 18px 16px 1fr auto auto;
        gap: 7px;
        align-items: center;
        padding: 3px 4px;
        border-radius: 6px;
      }
      .thread.on {
        background: var(--bg);
      }
      .thread .sym {
        font-family: ui-monospace, monospace;
        color: var(--ink2);
        text-align: center;
      }
      .thread small {
        color: var(--ink3);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }
      .dot.off {
        background: var(--line2);
      }
      .fmt {
        padding: 7px 9px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .fmt.on {
        background: var(--ink);
        color: #fff;
      }
      .fmt small {
        color: var(--ink3);
      }
      .dialogveil {
        position: absolute;
        inset: 0;
        background: rgba(24, 24, 27, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dialog {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .dialog header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        font-size: 15px;
      }
      .dialog footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .prefs {
        display: grid;
        grid-template-columns: 170px 1fr;
        min-height: 0;
        flex: 1;
      }
      .prefs nav {
        border-right: 1px solid var(--line);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .prefs nav span {
        padding: 6px 9px;
        border-radius: 7px;
        color: var(--ink2);
      }
      .prefs nav span.on {
        background: var(--bg);
        color: var(--ink);
        font-weight: 600;
      }
      .prefs section {
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .prefs .row > .lab {
        width: 170px;
      }
      .callout {
        position: absolute;
        background: var(--temp);
        color: #fff;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        white-space: nowrap;
      }
      .rail.one .tool {
        height: 38px;
      }
      .app > * {
        min-height: 0;
      }
      .rail {
        overflow: hidden;
      }
      .pbody .seg span {
        padding: 0 8px;
      }
      .tool {
        white-space: nowrap;
      }
      .tool.later {
        font-size: 9px;
      }
      .prefs .row > .lab:not(:first-child) {
        width: auto;
      }
      .prefs section {
        min-width: 0;
      }
      .row > .lab {
        width: 84px;
      }
      .brand {
        white-space: nowrap;
      }
    </style>

  <body>
    <div class="chooser">
      <b>G-095 layout mock-ups</b>
      <div class="grp" id="propBtns"></div>
      <div class="grp" id="screenBtns"></div>
    </div>
    <div class="wrap"><div class="frame" id="frame"></div></div>
    <script>
      // ---------- placeholder picture ----------
      const THREADS = [
        ["#f6efe4", "Cream", "·"],
        ["#f3c9d2", "Pink, pale", "○"],
        ["#e58aa2", "Rose", "+"],
        ["#c2385c", "Rose, dark", "■"],
        ["#7d1d3a", "Wine", "▲"],
        ["#f2c94c", "Yellow", "★"],
        ["#b7791f", "Ochre", "◆"],
        ["#9ccc8b", "Green, light", "/"],
        ["#4f8f4a", "Green", "×"],
        ["#2c5a33", "Green, dark", "●"],
        ["#b9d7e8", "Sky", "~"],
        ["#7fa9c9", "Blue, soft", "="],
      ];
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      function photoColour(x, y) {
        const dx = x - 0.5,
          dy = y - 0.42,
          r = Math.hypot(dx, dy * 1.15),
          a = Math.atan2(dy, dx);
        let c = [185 - 70 * y + 20 * Math.sin(x * 9), 215 - 30 * y, 232 - 60 * y]; // sky to soft blue
        if (y > 0.8) c = [70 + 60 * (1 - y) * 4, 120 + 40 * Math.sin(x * 30), 70];
        const leaf = Math.hypot((x - 0.62) * 1.2, (y - 0.72) * 2.6);
        if (leaf < 0.13) c = [60 + 500 * leaf, 130 + 380 * leaf, 70];
        if (Math.abs(x - 0.5 - 0.03 * Math.sin(y * 9)) < 0.014 && y > 0.5) c = [45, 95, 52];
        const petal = 0.3 * (0.72 + 0.28 * Math.cos(6 * a + 0.4));
        if (r < petal) {
          const t = r / petal;
          c = [125 + 120 * t, 30 + 175 * t * t, 60 + 150 * t * t];
        }
        if (r < 0.065) c = [242 - 600 * r, 201 - 900 * r, 76];
        return c;
      }
      function nearest(c, n) {
        let best = 0,
          bd = 1e9;
        const idx = n >= 12 ? [...Array(12).keys()] : n >= 7 ? [0, 1, 2, 3, 5, 8, 10] : [1, 3, 5, 8];
        for (const i of idx) {
          const p = hex(THREADS[i][0]);
          const d = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2;
          if (d < bd) {
            bd = d;
            best = i;
          }
        }
        return best;
      }
      function drawAll() {
        for (const cv of document.querySelectorAll("canvas[data-pic]")) {
          const kind = cv.dataset.pic,
            cols = +cv.dataset.cols || 60,
            cell = +cv.dataset.cell || 9,
            n = +cv.dataset.n || 12;
          const rows = Math.round(cols * 0.75),
            g = cv.getContext("2d");
          cv.width = cols * cell;
          cv.height = rows * cell;
          if (kind === "photo") {
            const im = g.createImageData(cv.width, cv.height);
            for (let y = 0; y < cv.height; y++)
              for (let x = 0; x < cv.width; x++) {
                const c = photoColour(x / cv.width, y / cv.height),
                  o = (y * cv.width + x) * 4;
                im.data[o] = c[0];
                im.data[o + 1] = c[1];
                im.data[o + 2] = c[2];
                im.data[o + 3] = 255;
              }
            g.putImageData(im, 0, 0);
            continue;
          }
          for (let r = 0; r < rows; r++)
            for (let c = 0; c < cols; c++) {
              const t = nearest(photoColour((c + 0.5) / cols, (r + 0.5) / rows), n);
              g.fillStyle = kind === "bw" ? "#fff" : THREADS[t][0];
              g.fillRect(c * cell, r * cell, cell, cell);
              if (kind === "bw" && cell >= 6) {
                g.fillStyle = "#18181b";
                g.font = `${cell - 2}px ui-monospace,monospace`;
                g.textAlign = "center";
                g.textBaseline = "middle";
                g.fillText(THREADS[t][2], c * cell + cell / 2, r * cell + cell / 2 + 0.5);
              }
            }
          if (cell >= 5)
            for (let i = 0; i <= cols; i++) {
              g.fillStyle = i % 10 === 0 ? "rgba(0,0,0,.55)" : "rgba(0,0,0,.13)";
              g.fillRect(i * cell, 0, 1, cv.height);
            }
          if (cell >= 5)
            for (let i = 0; i <= rows; i++) {
              g.fillStyle = i % 10 === 0 ? "rgba(0,0,0,.55)" : "rgba(0,0,0,.13)";
              g.fillRect(0, i * cell, cv.width, 1);
            }
          if (cv.dataset.text) {
            g.fillStyle = "#7d1d3a";
            g.font = `bold ${cell * 7}px Georgia,serif`;
            g.textBaseline = "top";
            g.fillText("Rosa", cell * 4, cell * 34);
            g.setLineDash([5, 4]);
            g.strokeStyle = "#b45309";
            g.lineWidth = 2;
            g.strokeRect(cell * 3, cell * 33, cell * 22, cell * 9);
          }
        }
      }
      const pic = (kind, cols, cell, extra = "") => `<canvas data-pic="${kind}" data-cols="${cols}" data-cell="${cell}" ${extra}></canvas>`;

      // ---------- small pieces ----------
      const seg = (items, on) =>
        `<span class="seg">${items.map((s, i) => `<span class="${i === on ? "on" : ""}">${s}</span>`).join("")}</span>`;
      const slider = (label, value, pct) =>
        `<div class="row"><span class="lab">${label}</span><span class="sl"><i style="left:${pct}%"></i></span><span class="val">${value}</span></div>`;
      const select = (label, value, w = "") =>
        `<div class="row"><span class="lab">${label}</span><span class="sel" style="flex:1;${w}">${value}</span></div>`;
      const tool = (g, name, cls = "") => `<span class="tool ${cls}"><b>${g}</b>${name}</span>`;
      const EDIT_TOOLS = [
        ["✎", "Brush"],
        ["╱", "Line"],
        ["▭", "Rectangle"],
        ["◯", "Oval"],
        ["◪", "Fill"],
        ["✂", "Lasso fill"],
        ["⬚", "Select"],
        ["➰", "Lasso"],
        ["✥", "Move"],
        ["T", "Text"],
        ["⌇", "Backstitch"],
        ["⌥", "BS edit"],
        ["⌗", "Crop"],
        ["✋", "Pan"],
        ["⌕", "Zoom"],
      ];
      const PHOTO_TOOLS = [
        ["⌗", "Crop"],
        ["✋", "Pan"],
        ["⌕", "Zoom"],
      ];
      const PHOTO_LATER = [

      function show() {
        const [p = "D", s = "photo"] = location.hash.slice(1).split("-");
        const prop = P[p] || P.D,
          scr = SCREENS.find((x) => x[0] === s) || SCREENS[0];
        document.getElementById("propBtns").innerHTML = Object.keys(P)
          .map(
            (k) =>
              `<button class="${P[k] === prop ? "on" : ""}" onclick="location.hash='${k}-${scr[0]}'">${P[k].name.split(" · ")[0]}</button>`
          )
          .join("");
        document.getElementById("screenBtns").innerHTML = SCREENS.map(
          ([k, n]) => `<button class="${k === scr[0] ? "on" : ""}" onclick="location.hash='${p}-${k}'">${n}</button>`
        ).join("");
        document.getElementById("frame").innerHTML =
          `<div class="title"><h1>${prop.name}</h1><span>${scr[1]} — ${prop.sub}</span></div>${prop.render(scr[0])}<div class="notes"><h3>What proposal ${prop.name.split(" · ")[0]} decides</h3>${prop.notes.map(([h, t]) => `<p><b>${h}.</b> ${t}</p>`).join("")}</div>`;
        for (const el of document.querySelectorAll("[data-span]")) el.style.gridColumn = "1 / -1";
        drawAll();
      }
      addEventListener("hashchange", show);
      show();
    </script>
  </body>
</html>
