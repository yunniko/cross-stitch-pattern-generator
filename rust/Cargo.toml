[workspace]
resolver = "2"
members = ["cs-core", "cs-export", "cs-bench", "cs-job", "cs-wasm"]
# cs-wasm builds only for wasm32: `cargo build --release -p cs-wasm --target wasm32-unknown-unknown`.
default-members = ["cs-core", "cs-export", "cs-bench", "cs-job"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = 1
