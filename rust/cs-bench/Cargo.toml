[package]
name = "cs-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cs-core = { path = "../cs-core", features = ["json"] }
cs-export = { version = "0.1.0", path = "../cs-export" }
rayon = "1"
serde_json = "1"
mimalloc = { version = "0.1", optional = true }

[features]
# mimalloc as the global allocator, to measure musl's own allocator against it (G-048).
mimalloc = ["dep:mimalloc"]
